services:
  db:
    image: postgres:17
    container_name: qeazy-db
    environment:
      POSTGRES_USER: qeazy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: qeazy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qeazy -d qeazy"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: